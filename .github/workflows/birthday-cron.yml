name: Daily Birthday Greeting Dispatcher (6:00 AM IST)

on:
  schedule:
    # 00:30 UTC is exactly 06:00 AM Indian Standard Time (IST) every day
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  dispatch-birthdays:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      - name: Run 6:00 AM Birthday Scan & Dispatch
        working-directory: ./backend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          VITE_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
          RESEND_SENDER_EMAIL: 'onboarding@jitus.tech'
        run: |
          node -e "
          import('./index.js').then(async m => {
            console.log('Running GitHub Actions 6:00 AM IST Birthday Scan...');
            const res = await m.executeDailyBirthdayCheck();
            console.log('Scan completed:', JSON.stringify(res));
            process.exit(0);
          }).catch(err => {
            console.error('Workflow error:', err);
            process.exit(1);
          });
          "
